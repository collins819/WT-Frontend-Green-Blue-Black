<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Apply | WT</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="dashboard.html"><span class="logo">WT</span><span>WT</span></a><nav><a href="dashboard.html">Dashboard</a><a href="profile.html">Profile</a></nav></header><main class="form-page"><div class="form-card"><span class="eyebrow">LOAN APPLICATION</span><h1>Request a short-term loan</h1><p class="muted">Enter the amount and repayment period you are requesting. Final terms are subject to WT review.</p><form id="loanForm"><label>Requested amount (KES)<input id="loanAmount" type="number" min="1000" step="500" placeholder="e.g. 10000" required></label><label>Repayment period<select id="loanPeriod" required><option value="">Select period</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="60">60 days</option></select></label><div class="estimate"><span>Illustrative interest</span><strong id="interest">KES 0</strong><span>Estimated total repayment</span><strong id="total">KES 0</strong></div><label>Purpose of loan<textarea placeholder="Briefly explain the intended use"></textarea></label><label class="check"><input type="checkbox" required> I understand this is an application and not a guarantee of approval.</label><button class="btn btn-primary full">Submit Application</button></form></div></main><script src="js/loan.js"></script></body></html>
