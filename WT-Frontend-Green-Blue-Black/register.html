<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | WT</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-bg">
<div class="auth-wrap wide"><a class="brand center" href="index.html"><span class="logo">WT</span><span>WT</span></a><div class="auth-card"><div class="steps"><span class="active">1 Account</span><span>2 Identity</span><span>3 Next of Kin</span></div><span class="eyebrow">CREATE ACCOUNT</span><h1>Register with WT</h1><p class="muted">Complete your details to continue to the loan application.</p>
<form id="registerForm"><div class="form-grid"><label>Full name<input required placeholder="Your full legal name"></label><label>Telephone number<input required type="tel" placeholder="07XX XXX XXX"></label><label>National ID number<input required placeholder="ID number"></label><label>Email address<input type="email" placeholder="Optional email"></label><label>Password<input required type="password" minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input required type="password" placeholder="Repeat password"></label></div>
<div class="upload-grid"><label class="upload">ID / identification photo<input type="file" accept="image/*"></label><label class="upload">Selfie<input type="file" accept="image/*" capture="user"></label></div>
<h3>Next-of-kin information</h3><div class="form-grid"><label>Full name<input required placeholder="Next-of-kin full name"></label><label>ID number<input required placeholder="ID number"></label><label>Telephone<input required type="tel" placeholder="07XX XXX XXX"></label><label class="upload">Next-of-kin selfie<input type="file" accept="image/*" capture="user"></label></div>
<label class="check consent"><input type="checkbox" required> I confirm that the information provided is accurate and agree to WT's terms and privacy notice.</label><button class="btn btn-primary full">Create Account</button></form></div></div><script src="js/auth.js"></script></body></html>
